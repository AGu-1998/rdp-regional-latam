
name: VPS Finder LATAM V4 - Multi Provider

on:
  workflow_dispatch:
    inputs:
      search_mode:
        description: "Region de investigacion"
        required: true
        type: choice
        default: all
        options:
          - all
          - brazil
          - latam

permissions:
  contents: read

jobs:
  regional-vps-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar buscador regional
        env:
          SEARCH_MODE: ${{ inputs.search_mode }}
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error
          import json
          import re
          import os
          from datetime import datetime, timezone
          from html.parser import HTMLParser

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.hidden = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style", "noscript", "svg"):
                      self.hidden += 1

              def handle_endtag(self, tag):
                  if tag in ("script", "style", "noscript", "svg"):
                      self.hidden = max(0, self.hidden - 1)

              def handle_data(self, data):
                  if not self.hidden:
                      self.parts.append(data)

          PROVIDERS = [
              {
                  "name": "Oracle Cloud",
                  "category": "Cloud VPS",
                  "country": "Multiple regions",
                  "url": "https://www.oracle.com/cloud/free/",
                  "free_url": "https://www.oracle.com/cloud/free/faq/",
                  "regions_url": "https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm",
                  "notes": "Always Free and trial; card verification required."
              },
              {
                  "name": "Amazon AWS",
                  "category": "Cloud VPS",
                  "country": "Brazil and other regions",
                  "url": "https://aws.amazon.com/free/",
                  "free_url": "https://aws.amazon.com/free/free-tier-faqs/",
                  "notes": "Free plan and promotional credits; not permanent VPS."
              },
              {
                  "name": "Google Cloud",
                  "category": "Cloud VPS",
                  "country": "Brazil and other regions",
                  "url": "https://cloud.google.com/free",
                  "free_url": "https://cloud.google.com/signup-faqs",
                  "notes": "Free Tier and temporary trial credits."
              },
              {
                  "name": "Microsoft Azure",
                  "category": "Cloud VPS",
                  "country": "Brazil and other regions",
                  "url": "https://azure.microsoft.com/free/",
                  "notes": "Free services and trial offers; verify duration."
              },
              {
                  "name": "Vultr",
                  "category": "VPS hosting",
                  "country": "Multiple regions",
                  "url": "https://www.vultr.com/",
                  "regions_url": "https://www.vultr.com/features/datacenter-locations/",
                  "notes": "Paid VPS provider; investigate regional locations."
              },
              {
                  "name": "DigitalOcean",
                  "category": "Cloud VPS",
                  "country": "Multiple regions",
                  "url": "https://www.digitalocean.com/",
                  "regions_url": "https://docs.digitalocean.com/platform/regional-availability/",
                  "notes": "Paid cloud provider; investigate regional availability."
              },
              {
                  "name": "Akamai Cloud",
                  "category": "Cloud VPS",
                  "country": "Multiple regions",
                  "url": "https://www.linode.com/",
                  "regions_url": "https://www.linode.com/global-infrastructure/",
                  "notes": "Paid cloud provider; investigate regional availability."
              }
          ]

          OCI_REGIONS = [
              {
                  "country": "Brazil",
                  "city": "Sao Paulo",
                  "region": "sa-saopaulo-1"
              },
              {
                  "country": "Brazil",
                  "city": "Vinhedo",
                  "region": "sa-vinhedo-1"
              },
              {
                  "country": "Chile",
                  "city": "Santiago",
                  "region": "sa-santiago-1"
              },
              {
                  "country": "Chile",
                  "city": "Valparaiso",
                  "region": "sa-valparaiso-1"
              },
              {
                  "country": "Colombia",
                  "city": "Bogota",
                  "region": "sa-bogota-1"
              },
              {
                  "country": "Mexico",
                  "city": "Queretaro",
                  "region": "mx-queretaro-1"
              },
              {
                  "country": "Mexico",
                  "city": "Monterrey",
                  "region": "mx-monterrey-1"
              }
          ]

          MODE = os.getenv("SEARCH_MODE", "all")

          if MODE == "brazil":
              OCI_REGIONS = [
                  r for r in OCI_REGIONS
                  if r["country"] == "Brazil"
              ]

          elif MODE == "latam":
              OCI_REGIONS = [
                  r for r in OCI_REGIONS
                  if r["country"] != "Brazil"
              ]

          KEYWORDS = [
              "always free",
              "free tier",
              "free trial",
              "promotional credit",
              "credit card",
              "debit card",
              "no credit card",
              "virtual machine",
              "compute instance",
              "vps",
              "512 mb",
              "1 gb",
              "brazil",
              "sao paulo",
              "vinhedo",
              "chile",
              "colombia",
              "mexico",
              "permanent",
              "monthly",
              "expires"
          ]

          def inspect_page(url):
              result = {
                  "url": url,
                  "http_status": None,
                  "reachable": False,
                  "keywords": [],
                  "error": None
              }

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 VPS-LATAM-Finder/4.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:
                      raw = response.read(250000)
                      result["http_status"] = response.status
                      result["reachable"] = True

                  html = raw.decode("utf-8", errors="ignore")
                  parser = TextExtractor()
                  parser.feed(html)

                  content = " ".join(parser.parts).lower()
                  content = re.sub(r"\s+", " ", content)

                  for keyword in KEYWORDS:
                      if keyword in content:
                          result["keywords"].append(keyword)

              except urllib.error.HTTPError as e:
                  result["http_status"] = e.code
                  result["error"] = "HTTP error"

              except Exception as e:
                  result["error"] = str(e)[:200]

              return result

          print("=" * 65)
          print("       VPS FINDER LATAM V4")
          print("       MULTI-PROVIDER RESEARCH")
          print("=" * 65)

          results = []

          for provider in PROVIDERS:
              print("\nPROVEEDOR:", provider["name"])

              provider_result = {
                  **provider,
                  "checked_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "pages": []
              }

              urls = [
                  provider["url"],
                  provider.get("free_url"),
                  provider.get("regions_url")
              ]

              for url in filter(None, urls):
                  print("Consultando:", url)

                  page = inspect_page(url)
                  provider_result["pages"].append(page)

                  print("HTTP:", page["http_status"])
                  print("Accesible:", page["reachable"])
                  print("Palabras encontradas:",
                        ", ".join(page["keywords"][:10]))

              results.append(provider_result)

          output = {
              "version": "4.0",
              "search_mode": MODE,
              "date": datetime.now(
                  timezone.utc
              ).isoformat(),
              "oci_regions": OCI_REGIONS,
              "providers": results,
              "limitations": [
                  "Page reachability does not prove VPS availability.",
                  "Keyword detection does not prove free eligibility.",
                  "No instances were created.",
                  "No payment methods were entered.",
                  "Capacity requires provider APIs and account permissions."
              ]
          }

          with open(
              "vps_latam_v4.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          with open(
              "vps_latam_v4.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("VPS FINDER LATAM V4\n")
              f.write("=" * 55 + "\n\n")

              for p in results:
                  f.write("PROVEEDOR: " + p["name"] + "\n")
                  f.write("Categoria: " + p["category"] + "\n")
                  f.write("Notas: " + p["notes"] + "\n")

                  for page in p["pages"]:
                      f.write(
                          "URL: " + page["url"] + "\n"
                      )
                      f.write(
                          "HTTP: " + str(page["http_status"]) + "\n"
                      )
                      f.write(
                          "Palabras: " +
                          ", ".join(page["keywords"]) + "\n"
                      )

                  f.write("\n" + "-" * 45 + "\n")

          print("\n" + "=" * 65)
          print("INVESTIGACION TERMINADA")
          print("Proveedores consultados:", len(results))
          print("Regiones OCI catalogadas:", len(OCI_REGIONS))
          print("JSON: vps_latam_v4.json")
          print("TXT: vps_latam_v4.txt")
          print("No se crearon instancias.")
          PY

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VPS-Finder-LATAM-V4
          path: |
            vps_latam_v4.json
            vps_latam_v4.txt
          if-no-files-found: warn
          retention-days: 14
