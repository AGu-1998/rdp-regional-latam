
name: VPS Finder LATAM V2 - Brazil First

on:
  workflow_dispatch:
    inputs:
      search_mode:
        description: "Seleccionar regiones"
        required: true
        type: choice
        default: all
        options:
          - all
          - brazil
          - latam

permissions:
  contents: read

jobs:
  regional-vps-finder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Buscar regiones LATAM
        env:
          SEARCH_MODE: ${{ inputs.search_mode }}
        run: |
          python - <<'PY'
          import requests
          import os
          import json
          from datetime import datetime, timezone

          regions = {
              "Brasil - Sao Paulo": "sa-saopaulo-1",
              "Brasil - Vinhedo": "sa-vinhedo-1",
              "Chile - Santiago": "sa-santiago-1",
              "Argentina - Buenos Aires": "sa-buenosaires-1",
              "Colombia - Bogota": "sa-bogota-1",
              "Mexico - Queretaro": "mx-queretaro-1",
              "Mexico - Monterrey": "mx-monterrey-1",
              "Uruguay - Montevideo": "sa-montevideo-1",
              "Peru - Lima": "sa-lima-1"
          }

          mode = os.getenv("SEARCH_MODE", "all")

          if mode == "brazil":
              regions = {
                  k: v for k, v in regions.items()
                  if k.startswith("Brasil")
              }

          elif mode == "latam":
              regions = {
                  k: v for k, v in regions.items()
                  if not k.startswith("Brasil")
              }

          results = []

          print("=" * 60)
          print("       VPS FINDER LATAM V2")
          print("=" * 60)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "VPS-LATAM-Finder/2.0"
          })

          for name, region in regions.items():

              endpoint = (
                  f"https://objectstorage.{region}.oraclecloud.com"
              )

              print(f"\nConsultando: {name}")
              print(f"Region: {region}")

              result = {
                  "name": name,
                  "region": region,
                  "checked_at": datetime.now(
                      timezone.utc
                  ).isoformat()
              }

              try:
                  response = session.get(
                      endpoint,
                      timeout=12
                  )

                  result["http_status"] = response.status_code
                  result["endpoint_reachable"] = (
                      response.status_code < 500
                  )

                  print("HTTP:", response.status_code)
                  print(
                      "Endpoint accesible:",
                      result["endpoint_reachable"]
                  )

              except requests.RequestException as error:
                  result["endpoint_reachable"] = False
                  result["error"] = str(error)
                  print("Error:", error)

              results.append(result)

          with open("vps_results.json", "w") as file:
              json.dump(results, file, indent=2, ensure_ascii=False)

          print("\n" + "=" * 60)
          print("RESULTADOS")
          print("=" * 60)

          for result in results:
              print(
                  result["name"],
                  "-",
                  "Accesible" if result["endpoint_reachable"]
                  else "Sin conexion"
              )

          print("\nArchivo generado: vps_results.json")
          print("Busqueda terminada.")
          print("IMPORTANTE:")
          print("La conexion HTTP no confirma capacidad de VPS.")
          print("Tampoco confirma que exista un plan gratuito.")
          PY

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VPS-Finder-LATAM-V2
          path: vps_results.json
          if-no-files-found: warn
          retention-days: 7
